name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("pdf_document_cleaner.py", "installer.iss", "requirements-build.txt")) {
            if (!(Test-Path $f)) { throw "Required source file missing: $f" }
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build PDF Document Cleaner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PDF_Document_Cleaner --distpath dist --workpath build\cleaner --specpath build\spec_cleaner --collect-all fitz --collect-all PIL pdf_document_cleaner.py
          $cleanerExe = "dist\PDF_Document_Cleaner\PDF_Document_Cleaner.exe"
          if (!(Test-Path $cleanerExe)) { throw "Cleaner EXE not found: $cleanerExe" }
          $cleanerCount = (Get-ChildItem "dist\PDF_Document_Cleaner" -Recurse -File).Count
          if ($cleanerCount -lt 2) { throw "Cleaner package incomplete: only $cleanerCount files." }
          Write-Host "Cleaner package ready: $cleanerCount files"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
          if (!(Test-Path "dist\PDF_Document_Cleaner_Setup.exe")) { throw "Installer not found" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Document-Cleaner-v1.5.0-Windows-Setup
          path: dist/PDF_Document_Cleaner_Setup.exe
          if-no-files-found: error
