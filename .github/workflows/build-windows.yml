
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract --yes --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Collect Tcl Tk libraries
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          $tclSource = Join-Path $pythonRoot "tcl\tcl8.6"
          $tkSource = Join-Path $pythonRoot "tcl\tk8.6"

          if (!(Test-Path "$tclSource\init.tcl")) {
            throw "Missing Tcl init.tcl"
          }

          if (!(Test-Path "$tkSource\pkgIndex.tcl")) {
            throw "Missing Tk pkgIndex.tcl"
          }

          New-Item -ItemType Directory -Force -Path "_tcl_data" | Out-Null
          New-Item -ItemType Directory -Force -Path "_tk_data" | Out-Null

          Copy-Item "$tclSource\*" "_tcl_data" -Recurse -Force
          Copy-Item "$tkSource\*" "_tk_data" -Recurse -Force

          Write-Host "Tcl and Tk libraries collected successfully."

      - name: Collect Tesseract OCR
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR"

          if (!(Test-Path "$tess\tesseract.exe")) {
            throw "Missing Tesseract"
          }

          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null

          Copy-Item "$tess\tesseract.exe" "tesseract\"
          Get-ChildItem "$tess" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "tesseract\"
          }

          Copy-Item "$tess\tessdata\osd.traineddata" "tesseract\tessdata\"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name PDF_Document_Cleaner `
            --collect-all fitz `
            --add-data "_tcl_data;_tcl_data" `
            --add-data "_tk_data;_tk_data" `
            --add-data "tesseract;tesseract" `
            pdf_document_cleaner.py

          if (!(Test-Path "dist\PDF_Document_Cleaner.exe")) {
            throw "EXE build failed"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

          if (!(Test-Path "dist\PDF_Document_Cleaner_Setup.exe")) {
            throw "Installer build failed"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Document-Cleaner-Windows-Setup
          path: dist/PDF_Document_Cleaner_Setup.exe
          if-no-files-found: error
