
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: choco install tesseract --yes --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Collect Tesseract files
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR"

          if (!(Test-Path "$tess\tesseract.exe")) {
            throw "Tesseract not found"
          }

          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null

          Copy-Item "$tess\tesseract.exe" "tesseract\"

          Get-ChildItem "$tess" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "tesseract\"
          }

          Copy-Item "$tess\tessdata\osd.traineddata" "tesseract\tessdata\"

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PDF_Document_Cleaner --collect-all fitz --add-data "tesseract;tesseract" pdf_document_cleaner.py

          if (!(Test-Path "dist\PDF_Document_Cleaner\PDF_Document_Cleaner.exe")) {
            throw "Application EXE not found"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

          if (!(Test-Path "dist\PDF_Document_Cleaner_Setup.exe")) {
            throw "Installer not found"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Document-Cleaner-Windows-Setup
          path: dist/PDF_Document_Cleaner_Setup.exe
          if-no-files-found: error
