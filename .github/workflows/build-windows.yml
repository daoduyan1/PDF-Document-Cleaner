
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: choco install tesseract --yes --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Collect Tesseract
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null
          Copy-Item "$tess\tesseract.exe" "tesseract\"
          Get-ChildItem "$tess" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "tesseract\"
          }
          Copy-Item "$tess\tessdata\osd.traineddata" "tesseract\tessdata\"

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name PDF_Document_Cleaner `
            --collect-all fitz `
            --add-data "tesseract;tesseract" `
            pdf_document_cleaner.py

          $appDir = "dist\PDF_Document_Cleaner"

          if (!(Test-Path "$appDir\PDF_Document_Cleaner.exe")) {
            throw "Missing application EXE"
          }

          if (!(Test-Path "$appDir\_internal\_tcl_data\init.tcl")) {
  throw "Missing Tcl init.tcl"
}

if (!(Test-Path "$appDir\_internal\_tk_data\tk.tcl")) {
  throw "Missing Tk data"
}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

          if (!(Test-Path "dist\PDF_Document_Cleaner_Setup.exe")) {
            throw "Missing installer"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Document-Cleaner-Windows-Setup
          path: dist/PDF_Document_Cleaner_Setup.exe
          if-no-files-found: error
